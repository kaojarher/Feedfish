<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>錦鯉池・投飼料養魚</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#efe6d8;--fg:#2a1a14;--card:#fffaf0;--line:#d8c7a8;--red:#c1221b;--gold:#e9b72b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1613;--fg:#f1e6d6;--card:#2b211c;--line:#4a3a30}}
:root[data-theme="dark"]{--bg:#1d1613;--fg:#f1e6d6;--card:#2b211c;--line:#4a3a30}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:"Noto Serif TC","PMingLiU","Songti TC",serif;padding:10px;-webkit-user-select:none;user-select:none}
.app{max-width:560px;margin:0 auto}
.top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
h1{margin:0;flex:1;font-weight:900;letter-spacing:.15em;font-size:clamp(18px,5.5vw,26px);background:var(--gold);color:#2a1a14;border:2px solid #7a4a10;padding:4px 8px;text-align:center}
.chip{background:var(--card);border:2px solid var(--line);border-radius:8px;padding:4px 8px;font-weight:600;font-size:14px;white-space:nowrap}
.pondbox{position:relative;height:clamp(320px,56vh,500px);border:5px solid var(--red);border-radius:8px;overflow:hidden;box-shadow:0 6px 0 #8f1610;touch-action:manipulation}
#pond{position:absolute;inset:0;width:100%;height:100%;display:block}
#vrm{position:absolute;right:2%;bottom:1%;width:28%;max-width:120px;aspect-ratio:.68;pointer-events:none}
.tip{position:absolute;left:8px;top:6px;font-size:12px;color:#fff;text-shadow:0 1px 2px #000;pointer-events:none}
#combo{position:absolute;left:8px;bottom:8px;font-weight:900;color:#ffe27a;text-shadow:0 2px 3px #000;font-size:18px;pointer-events:none}
.stk{margin:8px 0 6px;font-size:13px;font-weight:600;display:flex;gap:8px;align-items:center}
.bar{flex:1;height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--red);transition:width .2s}
.food{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
button{font:inherit;font-weight:600;font-size:13px;padding:9px 4px;border-radius:8px;border:2px solid #8f1610;background:var(--red);color:#fff7e0;cursor:pointer;box-shadow:0 3px 0 #8f1610}
button:active{transform:translateY(2px);box-shadow:0 1px 0 #8f1610}
button:disabled{opacity:.45}
.food button{background:var(--card);color:var(--fg);border-color:var(--line);box-shadow:0 3px 0 var(--line)}
.food button.on{background:var(--gold);border-color:#7a4a10;box-shadow:0 3px 0 #7a4a10;color:#2a1a14}
.nav{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:10px}
#msg{margin-top:8px;min-height:1.4em;font-size:13px;text-align:center}
#lic{font-size:11px;text-align:center;opacity:.7}
#panel{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:9}
#panel.on{display:flex}
.sheet{width:100%;max-width:560px;max-height:80vh;background:var(--bg);border:3px solid var(--red);border-bottom:0;border-radius:14px 14px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.ph{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;font-weight:900;font-size:17px}
.ph button{padding:4px 10px}
#pbody{overflow:auto;padding:0 12px 14px;-webkit-overflow-scrolling:touch}
.row{display:flex;align-items:center;gap:8px;background:var(--card);border:2px solid var(--line);border-radius:8px;padding:8px;margin-bottom:8px;font-size:13px}
.row .m{flex:1;min-width:0}.row b{font-size:14px}.row small{display:block;opacity:.75}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cell{background:var(--card);border:2px solid var(--line);border-radius:8px;padding:6px 2px;text-align:center;font-size:11px}
.dot{display:inline-block;width:34px;height:18px;border-radius:50%;margin-bottom:2px}
.R0{color:#8a9}.R1{color:#3b8ee8}.R2{color:#a24fe8}.R3{color:#e89a00}
.sel{outline:3px solid var(--gold)}
.pb{height:6px;background:var(--line);border-radius:3px;margin-top:4px;overflow:hidden}.pb i{display:block;height:100%;background:var(--gold)}
h3{margin:10px 0 6px;font-size:14px}
#res{margin-top:6px;font-size:13px;font-weight:600;text-align:center}
</style>
</head>
<body>
<div class="app">
<div class="top"><h1>錦鯉池</h1><span class="chip">🪙 <b id="coins">0</b></span><span class="chip">🐟 <b id="cnt">0</b></span></div>
<div class="pondbox"><canvas id="pond"></canvas><span class="tip">點水面請助手投料・點氣泡領獎勵・點陸地蓋建設</span><div id="combo"></div><canvas id="vrm"></canvas></div>
<div class="stk">🍚 <div class="bar"><i id="stk"></i></div><span id="stkt"></span></div>
<div class="food" id="food"></div>
<div id="res"></div>
<div class="nav">
<button data-t="shop">商店</button><button data-t="egg">魚蛋</button><button data-t="dex">圖鑑</button><button data-t="quest">任務</button><button data-t="chars">角色</button><button data-t="build">建設</button>
</div>
<div id="lic"></div><div id="msg">魚吃飽長大後會自動賣出換金幣。</div>
</div>
<div id="panel"><div class="sheet"><div class="ph"><span id="ptitle"></span><button id="pclose">✕</button></div><div id="pbody"></div></div></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@1.0.9/lib/three-vrm.min.js"></script>
<script>
const $=id=>document.getElementById(id),rnd=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.floor(Math.random()*a.length)];
const pc=$('pond'),px=pc.getContext('2d');let W=1,H=1,D=1;
/* ---------- 資料 ---------- */
const RN=['普通','稀有','史詩','傳說'],RC=['#8a9','#3b8ee8','#a24fe8','#e89a00'];
const SP=[
 {n:'紅白錦鯉',r:0,p:8,c:['#ff7a2f','#fff']},{n:'金魚',r:0,p:10,c:['#ffb347','#ffe9a8']},{n:'墨錦鯉',r:0,p:11,c:['#3b3b44','#e8452c']},
 {n:'三色錦鯉',r:1,p:22,c:['#f2f2f2','#e8452c']},{n:'黃金鯉',r:1,p:28,c:['#f2c21b','#fff0a0']},
 {n:'藍寶石鯉',r:2,p:48,c:['#3f7fe0','#aee0ff']},{n:'紅龍魚',r:2,p:65,c:['#d4161c','#ffb199']},{n:'彩虹鯉',r:3,p:130,rb:1,c:['#f00','#ff0']}];
const FT=[{n:'普通飼料',c:1,g:.07,col:'#f3d9a0'},{n:'營養飼料',c:3,g:.14,col:'#9be37a'},{n:'黃金飼料',c:6,g:.26,col:'#ffd23a'}];
const UP={cap:['飼料倉庫','最大飼料 +8',40],regen:['補給速度','飼料回復 +15%',50],grow:['營養配方','成長速度 +10%',60],sell:['行情加成','賣價 +10%',80],pond:['擴建池塘','魚數上限 +2',100],helper:['助手訓練','助手投料更快',45]};
const EGG=[{n:'普通魚蛋',c:20,o:[.7,.25,.05,0]},{n:'高級魚蛋',c:80,o:[0,.55,.35,.1]}];
const GH=(r,b,p)=>[`https://raw.githubusercontent.com/${r}/${b}/${p}`,`https://cdn.jsdelivr.net/gh/${r}@${b}/${p}`];
const VT='VRoid 範例模型使用條件',C0='CC0 公眾領域',MS='madjin/vrm-samples';
const CH=[
 {id:'f1',n:'紅衣漁夫',cost:0,spd:1,k:3,lu:0,fb:{s:0xc1221b,h:0xe9b72b,t:'cone',hair:0x3a2a20}},
 {id:'cb',n:'AvatarSample_B（VRM）',cost:0,spd:1.1,k:3,lu:.05,lic:'VRM 1.0 授權，免標註（VRoid Project / pixiv）',urls:GH('zoan37/ChatVRM','main','public/AvatarSample_B.vrm')},
 {id:'f2',n:'藍衣少年',cost:60,spd:1.2,k:3,lu:0,fb:{s:0x2f6fd0,h:0xffffff,t:'cyl',hair:0x222222}},
 {id:'f3',n:'金帽船長',cost:120,spd:1,k:4,lu:.1,fb:{s:0x1f3a6e,h:0xe9b72b,t:'cyl',hair:0x6a4a2a}},
 {id:'f4',n:'粉衣少女',cost:200,spd:1.3,k:3,lu:.1,fb:{s:0xe86aa0,h:0xffc2d8,t:'bun',hair:0x5a3020}},
 {id:'va',n:'AvatarSample_A',cost:150,spd:1.2,k:3,lu:.1,lic:VT,urls:GH(MS,'master','vroid/stable/AvatarSample_A.vrm')},
 {id:'vb',n:'AvatarSample_B（0.x）',cost:150,spd:1.1,k:4,lu:0,lic:VT,urls:GH(MS,'master','vroid/stable/AvatarSample_B.vrm')},
 {id:'vc',n:'AvatarSample_C',cost:150,spd:1.4,k:3,lu:0,lic:VT,urls:GH(MS,'master','vroid/stable/AvatarSample_C.vrm')},
 {id:'orion',n:'Orion',cost:250,spd:1.2,k:4,lu:.1,lic:C0,urls:GH(MS,'master','Avatar_Orion.vrm')},
 {id:'vita',n:'Vita',cost:300,spd:1.3,k:4,lu:.1,lic:C0,urls:GH(MS,'master','vroid/beta/Vita.vrm')},
 {id:'vivi',n:'Vivi',cost:300,spd:1.5,k:3,lu:.15,lic:C0,urls:GH(MS,'master','vroid/beta/Vivi.vrm')},
 {id:'vict',n:'Victoria Rubin',cost:400,spd:1.3,k:5,lu:.1,lic:C0,urls:GH(MS,'master','vroid/beta/Victoria_Rubin.vrm')},
 {id:'saku',n:'Sakurada Fumiriya',cost:400,spd:1.6,k:3,lu:.2,lic:C0,urls:GH(MS,'master','vroid/beta/Sakurada_Fumiriya.vrm')},
 {id:'shino',n:'Sendagaya Shino',cost:500,spd:1.4,k:4,lu:.25,lic:C0,urls:GH(MS,'master','vroid/beta/Sendagaya_Shino.vrm')},
 {id:'seed',n:'Seed-san',cost:600,spd:1.5,k:5,lu:.2,lic:'VRM 1.0 授權；使用時必須標註作者：VirtualCast, Inc.',urls:GH(MS,'master','Seed-san/vrm/Seed-san.vrm')}];
const QT={feed:['投料',1.5],sell:['賣出錦鯉',14],earn:['賺取金幣',.45],hatch:['孵化魚蛋',30]},QN={feed:[15,30,60],sell:[3,6,10],earn:[80,200,400],hatch:[1,2,3]};
const BLD=[
 {id:'hut',n:'飼料小屋',t:'b',c:{w:12,s:4},e:'飼料上限 +10',fx:.08,fy:.5},{id:'sakura',n:'櫻花樹',t:'d',c:{w:10},e:'裝飾：賣價 +1%',fx:.2,fy:.5},
 {id:'bamboo',n:'竹叢',t:'d',c:{w:6},e:'裝飾：賣價 +1%',fx:.31,fy:.55},{id:'flag',n:'錦鯉旗',t:'d',c:{w:5},e:'裝飾：賣價 +1%',fx:.42,fy:.55},
 {id:'stall',n:'魚市攤位',t:'b',c:{w:20,s:10},e:'賣價 +10%',fx:.55,fy:.6},
 {id:'lantern',n:'石燈籠',t:'d',c:{s:6},e:'裝飾：賣價 +1%',fx:.08,fy:.88},{id:'flower',n:'花圃',t:'d',c:{w:4,s:2},e:'裝飾：賣價 +1%',fx:.2,fy:.9},
 {id:'pavilion',n:'涼亭',t:'b',c:{w:30,s:20,p:4},e:'離線收益 ×1.5',fx:.34,fy:.88},{id:'bridge',n:'石拱橋',t:'d',c:{s:12},e:'裝飾：賣價 +1%',fx:.47,fy:.9},
 {id:'torii',n:'鳥居',t:'b',c:{w:15,s:15,p:2},e:'助手幸運 +10%',fx:.58,fy:.9}];
/* ---------- 存檔 ---------- */
let G={coins:25,lv:{cap:0,regen:0,grow:0,sell:0,pond:0,helper:0},fish:[{sp:0,s:.4},{sp:1,s:.3},{sp:2,s:.5}],disc:[0,1,2],un:['f1','cb'],ch:'cb',q:[],daily:'',streak:0,seen:Date.now(),snd:true,res:{w:0,s:0,p:0},built:[]};
try{const t=localStorage.getItem('koi5');if(t){const o=JSON.parse(t);G=Object.assign(G,o);G.lv=Object.assign({cap:0,regen:0,grow:0,sell:0,pond:0,helper:0},o.lv);G.res=Object.assign({w:0,s:0,p:0},o.res);G.built=o.built||[];}}catch(e){}
function save(){try{G.fish=fishes.map(f=>({sp:f.sp,s:f.s}));G.seen=Date.now();localStorage.setItem('koi5',JSON.stringify(G));}catch(e){}}
function mkQ(){const k=pick(Object.keys(QT)),n=pick(QN[k]);return{k,n,p:0,r:Math.round(n*QT[k][1])};}
while(G.q.length<3)G.q.push(mkQ());
const track=(k,v=1)=>{for(const q of G.q)if(q.k===k&&q.p<q.n)q.p=Math.min(q.n,q.p+v);};
/* ---------- 狀態 ---------- */
let stock=10,ftype=0,combo=0,comboT=0,fishes=[],foods=[],ripples=[],pops=[],bubbles=[],bubT=15,tm=0,saveT=0,queue=[],proj=[],WH=300,cb={x:0,y:0,w:1,h:1};
const sellMul=()=>1+.1*G.lv.sell+(G.built.includes('stall')?.1:0)+.01*BLD.filter(b=>b.t==='d'&&G.built.includes(b.id)).length;
const maxStock=()=>20+8*G.lv.cap+(G.built.includes('hut')?10:0),maxFish=()=>6+2*G.lv.pond,cs=()=>CH.find(c=>c.id===G.ch)||CH[0];
const upCost=k=>Math.round(UP[k][2]*Math.pow(1.6,G.lv[k])),upMax=k=>k==='pond'?5:10;
const helperInt=()=>4/(1+.4*G.lv.helper)/cs().spd;
let AC=null;
function beep(f,d=.08,t='sine'){if(!G.snd)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime;o.type=t;o.frequency.value=f;g.gain.setValueAtTime(.05,n);g.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(n+d);}catch(e){}}
let mt;function msg(t){$('msg').textContent=t;clearTimeout(mt);mt=setTimeout(()=>$('msg').textContent='魚吃飽長大後會自動賣出換金幣。',3000);}
function newFish(sp,s=.3){fishes.push({sp,x:rnd(40,W-40),y:rnd(WH*.15,WH*.8),a:rnd(0,6.28),s,ph:rnd(0,6),tx:0,ty:0,tt:0});}
function drop(x,y,n=3,t=0){for(let i=0;i<n;i++)foods.push({x:x+rnd(-16,16),y:y+rnd(-8,8),life:9,t});ripples.push({x,y,r:2,a:.7});}
const pop=(x,y,t)=>pops.push({x,y,t,l:1.3});
function resize(){const r=pc.parentElement.getBoundingClientRect();D=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;WH=H*.74;pc.width=W*D;pc.height=H*D;px.setTransform(D,0,0,D,0,0);
  if(R){const v=$('vrm');R.setSize(v.clientWidth,v.clientHeight,false);cam.aspect=v.clientWidth/v.clientHeight;cam.updateProjectionMatrix();}
  cb={x:c2.offsetLeft,y:c2.offsetTop,w:c2.offsetWidth,h:c2.offsetHeight};}
pc.addEventListener('pointerdown',e=>{
  const x=e.offsetX,y=e.offsetY;
  if(y>WH){tab='build';P.classList.add('on');render();return;}
  for(const b of bubbles)if(Math.hypot(b.x-x,b.y-y)<30){
    bubbles.splice(bubbles.indexOf(b),1);beep(880,.15);const r=Math.random();
    if(r<.35){const c=Math.round(rnd(15,45));G.coins+=c;track('earn',c);pop(b.x,b.y,'+'+c+' 🪙');}
    else if(r<.65){stock=Math.min(maxStock(),stock+10);pop(b.x,b.y,'+10 🍚');}
    else{const k=Math.random()<.5?'w':'s';G.res[k]+=3;pop(b.x,b.y,'+3 '+(k==='w'?'🪵':'🪨'));}
    return;}
  const c=FT[ftype].c;if(stock<c)return pop(x,y,'飼料不足');
  if(queue.length>=4)return pop(x,y,'助手忙碌中');
  stock-=c;queue.push({x,y,n:3,t:ftype});track('feed');
});
/* ---------- 面板 ---------- */
const P=$('panel'),PB=$('pbody');let tab='';
const TT={shop:'🛒 升級商店',egg:'🥚 魚蛋孵化',dex:'📖 魚種圖鑑',quest:'📋 任務與簽到',chars:'🧑 選擇助手',build:'🏗️ 建設'};
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;P.classList.add('on');render();beep(500,.05);});
$('pclose').onclick=()=>P.classList.remove('on');P.onclick=e=>{if(e.target===P)P.classList.remove('on');};
function render(){
  $('ptitle').textContent=TT[tab];let h='';
  if(tab==='shop'){
    for(const k in UP){const L=G.lv[k],mx=L>=upMax(k);h+=`<div class="row"><div class="m"><b>${UP[k][0]}</b> Lv.${L}/${upMax(k)}<small>${UP[k][1]}</small></div><button data-a="up" data-v="${k}" ${mx||G.coins<upCost(k)?'disabled':''}>${mx?'已滿級':'🪙'+upCost(k)}</button></div>`;}
    h+=`<small>魚數上限 ${maxFish()}・飼料上限 ${maxStock()}</small>`;
  }else if(tab==='egg'){
    EGG.forEach((e,i)=>{h+=`<div class="row"><div class="m"><b>${e.n}</b><small>${e.o.map((p,j)=>p?RN[j]+' '+Math.round(p*100)+'%':'').filter(Boolean).join('・')}</small></div><button data-a="egg" data-v="${i}" ${G.coins<e.c?'disabled':''}>🪙${e.c}</button></div>`;});
    h+=`<small>目前 ${fishes.length}/${maxFish()} 條。新魚種首次入池可得發現獎勵。</small>`;
  }else if(tab==='dex'){
    h+=`<small>已發現 ${G.disc.length}/${SP.length}</small><div class="grid" style="margin-top:6px">`;
    SP.forEach((s,i)=>{const ok=G.disc.includes(i),n=fishes.filter(f=>f.sp===i).length;
      h+=`<div class="cell"><span class="dot" style="background:${ok?(s.rb?'linear-gradient(90deg,red,yellow,lime,cyan,violet)':s.c[0]):'#777'}"></span><br>${ok?s.n:'？？？'}<br><span class="R${s.r}">${RN[s.r]}</span>${ok?'<br>🪙'+s.p+' ×'+n:''}</div>`;});
    h+='</div>';
  }else if(tab==='quest'){
    const today=new Date().toDateString();
    h+=`<div class="row"><div class="m"><b>每日簽到</b>（連續 ${G.streak} 天）<small>獎勵 🪙${20+10*Math.min(G.streak||0,7)}</small></div><button data-a="daily" ${G.daily===today?'disabled':''}>${G.daily===today?'已簽到':'簽到'}</button></div><h3>任務</h3>`;
    G.q.forEach((q,i)=>{h+=`<div class="row"><div class="m"><b>${QT[q.k][0]} ${q.n}</b><small>獎勵 🪙${q.r}</small><div class="pb"><i style="width:${q.p/q.n*100}%"></i></div></div><button data-a="qc" data-v="${i}" ${q.p<q.n?'disabled':''}>領取</button></div>`;});
  }else if(tab==='build'){
    h+=`<div class="row"><div class="m"><b>資源</b><small>🪵${G.res.w}　🪨${G.res.s}　🦪${G.res.p}（賣魚、點氣泡可獲得）</small></div></div>`;
    for(const b of BLD){const own=G.built.includes(b.id),ok=G.res.w>=(b.c.w||0)&&G.res.s>=(b.c.s||0)&&G.res.p>=(b.c.p||0);

}
function drawLand(){
  const L=H-WH;let g=px.createLinearGradient(0,WH,0,H);g.addColorStop(0,'#6aa84f');g.addColorStop(1,'#3f7a33');px.fillStyle=g;px.fillRect(0,WH,W,L);
  px.fillStyle='rgba(214,190,140,.55)';px.beginPath();px.ellipse(W*.78,H-L*.2,W*.3,L*.22,0,0,6.28);px.fill();
  px.strokeStyle='rgba(20,70,20,.5)';px.lineWidth=1.5;
  for(let i=0;i<40;i++){const x=(i*73%100)/100*W,y=WH+12+(i*41%100)/100*(L-16);px.beginPath();px.moveTo(x,y);px.lineTo(x-2,y-6);px.moveTo(x,y);px.lineTo(x+2,y-6);px.stroke();}
  for(let x=0;x<W;x+=18){px.fillStyle=(x/18|0)%2?'#a89a82':'#8f836d';px.beginPath();px.ellipse(x+9,WH+1,11,6,0,0,6.28);px.fill();}
  px.fillStyle='rgba(0,0,0,.28)';px.beginPath();px.ellipse(cb.x+cb.w*.5,cb.y+cb.h*.95,cb.w*.3,6,0,0,6.28);px.fill();
  BLD.filter(b=>G.built.includes(b.id)).sort((a,b)=>a.fy-b.fy).forEach(b=>drawItem(b.id,b.fx*W,WH+L*b.fy));
}
function draw(){
  px.save();px.beginPath();px.rect(0,0,W,WH);px.clip();
  let g=px.createLinearGradient(0,0,0,WH);g.addColorStop(0,'#63bcc6');g.addColorStop(.5,'#2a86a3');g.addColorStop(1,'#0f3f5c');px.fillStyle=g;px.fillRect(0,0,W,WH);
  px.fillStyle='rgba(8,40,60,.16)';for(let i=0;i<18;i++){px.beginPath();px.ellipse((i*97%100)/100*W,(i*61%100)/100*WH,18+i%4*8,(18+i%4*8)*.45,0,0,6.28);px.fill();}
  px.globalCompositeOperation='lighter';px.strokeStyle='rgba(180,255,255,.08)';px.lineWidth=2;
  for(let i=0;i<14;i++){px.beginPath();px.ellipse((i*83%100)/100*W+Math.sin(tm+i)*14,(i*57%100)/100*WH+Math.cos(tm*.8+i)*8,28+i%3*12,10+i%2*6,0,0,6.28);px.stroke();}
  px.globalCompositeOperation='source-over';
  for(let i=0;i<5;i++)pad(i,true);
  for(const o of foods){const k=kk(o.y);px.fillStyle='rgba(0,20,30,.25)';px.beginPath();px.ellipse(o.x+6,o.y+11,4*k,2*k,0,0,6.28);px.fill();}
  [...fishes].sort((a,b)=>a.y-b.y).forEach(drawFish);
  for(let i=0;i<5;i++)pad(i,false);
  for(const r of ripples){px.strokeStyle='rgba(255,255,255,'+r.a+')';px.lineWidth=1.5;px.beginPath();px.ellipse(r.x,r.y,r.r,r.r*.45,0,0,6.28);px.stroke();px.beginPath();px.ellipse(r.x,r.y,r.r*.6,r.r*.27,0,0,6.28);px.stroke();}
  for(const o of foods){const rr=3.8*kk(o.y),col=FT[o.t].col,rg=px.createRadialGradient(o.x-rr*.35,o.y-rr*.4,.5,o.x,o.y,rr);rg.addColorStop(0,'#fff');rg.addColorStop(1,col);px.fillStyle=rg;px.beginPath();px.arc(o.x,o.y,rr,0,6.28);px.fill();}
  for(const b of bubbles){const rg=px.createRadialGradient(b.x-8,b.y-8,2,b.x,b.y,24);rg.addColorStop(0,'rgba(255,255,255,.9)');rg.addColorStop(1,'rgba(255,230,120,.35)');px.fillStyle=rg;px.strokeStyle='rgba(255,255,255,.8)';px.lineWidth=2;px.beginPath();px.arc(b.x,b.y,22,0,6.28);px.fill();px.stroke();px.fillStyle='#c1221b';px.font='bold 18px serif';px.textAlign='center';px.fillText('福',b.x,b.y+6);}
  let v=px.createRadialGradient(W/2,WH/2,Math.min(W,WH)*.35,W/2,WH/2,Math.max(W,WH)*.75);v.addColorStop(0,'rgba(0,15,25,0)');v.addColorStop(1,'rgba(0,15,25,.5)');px.fillStyle=v;px.fillRect(0,0,W,WH);
  let t=px.createLinearGradient(0,0,0,WH*.16);t.addColorStop(0,'rgba(0,10,20,.55)');t.addColorStop(1,'rgba(0,10,20,0)');px.fillStyle=t;px.fillRect(0,0,W,WH*.16);
  let wl=px.createLinearGradient(0,0,0,WH*.05);wl.addColorStop(0,'#d8cbb0');wl.addColorStop(1,'#8a7a62');px.fillStyle=wl;px.fillRect(0,0,W,WH*.05);
  px.restore();
  drawLand();
  for(const q of proj){if(q.u<0)continue;const u=q.u,x=q.x0+(q.x1-q.x0)*u,y=q.y0+(q.y1-q.y0)*u-Math.sin(Math.PI*u)*70;
    px.fillStyle='rgba(0,0,0,.2)';px.beginPath();px.ellipse(q.x0+(q.x1-q.x0)*u,q.y0+(q.y1-q.y0)*u+6,3,1.5,0,0,6.28);px.fill();
    px.fillStyle=FT[q.t].col;px.beginPath();px.arc(x,y,4,0,6.28);px.fill();px.strokeStyle='#fff';px.lineWidth=1;px.stroke();}
  px.font='bold 15px sans-serif';px.textAlign='center';for(const p of pops){px.fillStyle='rgba(255,230,120,'+Math.min(1,p.l)+')';px.fillText(p.t,p.x,p.y);}
}
let last=performance.now();
function loop(n){const dt=Math.min(.05,(n-last)/1000);last=n;update(dt);draw();requestAnimationFrame(loop);}
addEventListener('resize',resize);addEventListener('pagehide',save);
resize();buildFood();
for(const f of G.fish)newFish(f.sp,f.s);
{const mins=Math.min(Date.now()-G.seen,108e5)/6e4;const g=Math.floor(mins*fishes.length*.15*(1+.1*G.lv.helper)*(G.built.includes('pavilion')?1.5:1));if(g>0&&mins>2){G.coins+=g;msg('離線期間助手幫你賺了 '+g+' 🪙');}}
requestAnimationFrame(loop);initThree();
</script>
